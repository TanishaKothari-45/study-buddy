steps:
  # ===========================================
  # Step 1: Build Docker Image
  # ===========================================
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:${COMMIT_SHA}',
      '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:latest',
      '.'
    ]
    dir: 'web'
    env:
      # Pass public env vars during build if needed (though we hardcoded them in Dockerfile for simplicity)
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'
      - 'NEXT_PUBLIC_MAP_SERVICE_URL=${_NEXT_PUBLIC_MAP_SERVICE_URL}'

  # ===========================================
  # Step 2: Push Image to Artifact Registry
  # ===========================================
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:latest']

  # ===========================================
  # Step 3: Deploy to Cloud Run
  # ===========================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:latest'
      - '--region=${_REGION}'
      - '--allow-unauthenticated'
      # Re-apply runtime env vars to ensure they persist
      - '--set-env-vars=NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'
      - '--set-env-vars=NEXT_PUBLIC_MAP_SERVICE_URL=${_NEXT_PUBLIC_MAP_SERVICE_URL}'
      - '--set-env-vars=NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}'
      - '--set-env-vars=NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}'

substitutions:
  _REGION: 'asia-south1'
  _SERVICE_NAME: 'study-buddy-web'
  # Default empty strings (must be set in Trigger)
  _NEXT_PUBLIC_API_URL: ''
  _NEXT_PUBLIC_MAP_SERVICE_URL: ''
  _NEXT_PUBLIC_SUPABASE_URL: ''
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ''

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:latest'
