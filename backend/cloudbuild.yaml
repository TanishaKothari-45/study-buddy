# ===========================================
# Cloud Build CI/CD Pipeline for Study Buddy
# Optimized with Kaniko caching for faster builds
# Builds and deploys BOTH API and Worker to Cloud Run
# ===========================================

steps:
  # ===========================================
  # Step 1: Build with Kaniko (with layer caching)
  # Kaniko handles both build AND push in one step
  # Cache is stored in Artifact Registry for reuse
  # ===========================================
  - name: 'gcr.io/kaniko-project/executor:latest'
    id: 'build-image'
    args:
      - '--dockerfile=Dockerfile'
      - '--context=dir://backend'
      - '--destination=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${BUILD_ID}'
      - '--destination=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:latest'
      # Build arguments for pre-built base image
      - '--build-arg=REGION=${_REGION}'
      - '--build-arg=PROJECT_ID=${PROJECT_ID}'
      - '--build-arg=REPO=${_REPO}'
      # Enable layer caching in Artifact Registry
      - '--cache=true'
      - '--cache-ttl=168h'
      # Cache location (uses same repo)
      - '--cache-repo=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend/cache'
      # Optimization flags for faster builds
      - '--snapshot-mode=time'
      - '--single-snapshot'
      - '--use-new-run'
      - '--compressed-caching=false'

  # ===========================================
  # Step 2: Deploy API Service to Cloud Run
  # ===========================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'study-buddy-api'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${BUILD_ID}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--service-account=${_SERVICE_ACCOUNT}'
      - '--vpc-connector=${_VPC_CONNECTOR}'
      - '--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,PINECONE_API_KEY=PINECONE_API_KEY:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest,REDIS_URL=REDIS_URL:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_JWT_SECRET=SUPABASE_JWT_SECRET:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,MAP_SERVICE_URL=MAP_SERVICE_URL:latest'
      - '--set-env-vars=ENVIRONMENT=production,PINECONE_INDEX_NAME=study-buddy,GCS_BUCKET_NAME=${_GCS_BUCKET}'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=300'
      - '--concurrency=80'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--allow-unauthenticated'
    waitFor:
      - 'build-image'

  # ===========================================
  # Step 3: Deploy Worker Service to Cloud Run
  # ===========================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-worker'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'study-buddy-worker'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${BUILD_ID}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--service-account=${_SERVICE_ACCOUNT}'
      - '--vpc-connector=${_VPC_CONNECTOR}'
      - '--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,PINECONE_API_KEY=PINECONE_API_KEY:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest,REDIS_URL=REDIS_URL:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_JWT_SECRET=SUPABASE_JWT_SECRET:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,MAP_SERVICE_URL=MAP_SERVICE_URL:latest'
      - '--set-env-vars=ENVIRONMENT=production,PINECONE_INDEX_NAME=study-buddy,GCS_BUCKET_NAME=${_GCS_BUCKET}'
      # Override the default CMD to run the Arq worker with health check endpoint
      - '--command=python'
      - '--args=-m,app.worker_entrypoint'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=900'
      # Worker needs min 1 instance to always be ready to process jobs
      - '--min-instances=1'
      - '--max-instances=3'
      # No HTTP traffic - worker only processes Redis jobs
      - '--no-allow-unauthenticated'
      # No CPU throttling when not receiving requests (worker is always working)
      - '--cpu-boost'
      - '--no-cpu-throttling'
    waitFor:
      - 'build-image'

# ===========================================
# Substitution Variables (Override via CLI or Trigger)
# ===========================================
substitutions:
  _REGION: 'asia-south1'
  _REPO: 'study-buddy'
  _SERVICE_ACCOUNT: 'study-buddy-backend@${PROJECT_ID}.iam.gserviceaccount.com'
  _VPC_CONNECTOR: 'projects/${PROJECT_ID}/locations/asia-south1/connectors/study-buddy-connector'
  _GCS_BUCKET: 'study-buddy-uploads'

# ===========================================
# Build Options
# ===========================================
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# ===========================================
# Build Timeout (15 minutes with pre-built base image)
# Regular builds should complete in 3-5 min
# ===========================================
timeout: '900s'
